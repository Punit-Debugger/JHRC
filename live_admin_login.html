<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JHRC Admin Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #050816 0%, #0a1a2e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .login-card {
            background: rgba(5, 8, 22, 0.8);
            border: 1px solid rgba(255, 204, 0, 0.2);
            border-radius: 15px;
            padding: 40px 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-container {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-container img {
            max-width: 80px;
            height: auto;
            margin-bottom: 15px;
        }

        .logo-container h1 {
            font-size: 24px;
            font-weight: 700;
            color: #ffcc00;
            margin-bottom: 5px;
        }

        .logo-container p {
            font-size: 14px;
            color: #cbd5e1;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #e2e8f0;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid rgba(255, 204, 0, 0.3);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .form-group input:focus {
            outline: none;
            border-color: #ffcc00;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 10px rgba(255, 204, 0, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #ffcc00 0%, #ffb700 100%);
            border: none;
            border-radius: 8px;
            color: #050816;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .login-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 204, 0, 0.3);
        }

        .login-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .btn-text {
            display: inline;
        }

        .btn-loader {
            display: none;
            margin-right: 8px;
        }

        .login-btn:disabled .btn-text {
            display: none;
        }

        .login-btn:disabled .btn-loader {
            display: inline;
        }

        .error-message {
            margin-top: 15px;
            padding: 12px 15px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            color: #fca5a5;
            font-size: 13px;
            display: none;
            animation: shake 0.3s ease;
        }

        .error-message.show {
            display: block;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .success-message {
            margin-top: 15px;
            padding: 12px 15px;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 8px;
            color: #86efac;
            font-size: 13px;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .info-text {
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
            margin-top: 20px;
        }

        .info-text a {
            color: #ffcc00;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .info-text a:hover {
            color: #ffb700;
        }

        @media (max-width: 600px) {
            .login-card {
                padding: 30px 20px;
            }

            .logo-container h1 {
                font-size: 20px;
            }

            .logo-container img {
                max-width: 70px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo-container">
                <i class="fas fa-user-shield" style="font-size: 50px; color: #ffcc00; margin-bottom: 10px;"></i>
                <h1>Admin Login</h1>
                <p>JHRC Library & Coaching</p>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">
                        <i class="fas fa-user" style="margin-right: 8px; color: #ffcc00;"></i>Username
                    </label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        placeholder="Enter your username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock" style="margin-right: 8px; color: #ffcc00;"></i>Password
                    </label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" class="login-btn" id="loginBtn">
                    <span class="btn-loader">
                        <i class="fas fa-spinner fa-spin"></i>
                    </span>
                    <span class="btn-text">
                        <i class="fas fa-sign-in-alt" style="margin-right: 8px;"></i>Login
                    </span>
                </button>
            </form>

            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>

            <p class="info-text">
                <i class="fas fa-info-circle" style="margin-right: 5px;"></i>
                Use your admin credentials to login
            </p>
        </div>
    </div>

    <script>
        async function handleLogin(event) {
            event.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorEl = document.getElementById('errorMessage');
            const successEl = document.getElementById('successMessage');
            const loginBtn = document.getElementById('loginBtn');

            // Clear previous messages
            errorEl.classList.remove('show');
            errorEl.textContent = '';
            successEl.classList.remove('show');
            successEl.textContent = '';

            // Validate inputs
            if (!username || !password) {
                errorEl.textContent = 'Please enter both username and password.';
                errorEl.classList.add('show');
                return;
            }

            // Disable button and show loading state
            loginBtn.disabled = true;

            try {
                const response = await fetch('/admin/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    // Login failed
                    errorEl.textContent = data.message || 'Login failed. Please try again.';
                    errorEl.classList.add('show');
                    loginBtn.disabled = false;
                    return;
                }

                // Login successful
                if (data.token) {
                    // Save token to sessionStorage
                    sessionStorage.setItem('adminToken', data.token);

                    // Show success message
                    successEl.textContent = 'Login successful! Redirecting...';
                    successEl.classList.add('show');

                    // Redirect to admin dashboard
                    setTimeout(() => {
                        window.location.href = 'admin.html';
                    }, 500);
                } else {
                    errorEl.textContent = 'No token received. Please try again.';
                    errorEl.classList.add('show');
                    loginBtn.disabled = false;
                }

            } catch (error) {
                console.error('Login error:', error);
                errorEl.textContent = 'An error occurred. Please check your connection and try again.';
                errorEl.classList.add('show');
                loginBtn.disabled = false;
            }
        }

        // Allow Enter key to submit form
        document.getElementById('loginForm').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleLogin(e);
            }
        });

        // Redirect if already logged in
        window.addEventListener('load', () => {
            const token = sessionStorage.getItem('adminToken');
            if (token) {
                window.location.href = 'admin.html';
            }
        });
    </script>
</body>
</html>
