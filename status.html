<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

<title>

JHRC Library - Admission Status

</title>

<style>

body{

    margin:0;
    padding:0;

    font-family:Arial,sans-serif;

    background:
    linear-gradient(
        135deg,
        #003366,
        #0055aa
    );

    min-height:100vh;

}

.container{

    width:90%;
    max-width:500px;

    margin:50px auto;

    background:
    rgba(255,255,255,0.96);

    padding:30px;

    border-radius:15px;

    box-shadow:
    0 10px 30px rgba(0,0,0,0.2);

    text-align:center;

}

.logo{

    width:100px;

    margin-bottom:10px;

}

.library-title{

    color:#003366;

    margin:0;

}

.tagline{

    color:#666;

    font-size:14px;

    margin-top:5px;

    margin-bottom:25px;

}

h2{

    color:#003366;

}

input{

    width:100%;

    padding:12px;

    margin-top:15px;

    border:1px solid #ccc;

    border-radius:6px;

    box-sizing:border-box;

    font-size:16px;

}

button{

    width:100%;

    padding:12px;

    margin-top:15px;

    border:none;

    border-radius:6px;

    background:#003366;

    color:white;

    font-size:16px;

    cursor:pointer;

}

button:hover{

    opacity:0.9;

}

#result{

    margin-top:25px;

}

.status-approved{

    background:#e8f8ee;

    color:#0a7a2f;

    padding:15px;

    border-radius:8px;

    font-weight:bold;

}

.status-pending{

    background:#fff3cd;

    color:#856404;

    padding:15px;

    border-radius:8px;

    font-weight:bold;

}

.status-invalid{

    background:#fdecea;

    color:#c62828;

    padding:15px;

    border-radius:8px;

    font-weight:bold;

}

.download-btn{

    display:inline-block;

    margin-top:15px;

    padding:12px 20px;

    background:green;

    color:white;

    text-decoration:none;

    border-radius:6px;

    font-weight:bold;

}

.footer{

    margin-top:25px;

    color:#777;

    font-size:12px;

}

</style>

</head>

<body>

<div class="container">
<img
src="assets/logo.png"
alt="JHRC Library"
class="logo"
>

<h1 class="library-title">

    JHRC LIBRARY

</h1>

<p class="tagline">

    A PERFECT PLACE FOR STUDY & SUCCESS

</p>

<h2>

    Check Admission Status

</h2>

<input
type="text"
id="receiptId"
placeholder="Enter Receipt ID"
>

<button onclick="checkStatus()">

    Check Status

</button>

<div id="result"></div>

<div class="footer">

    © JHRC Library

</div>
```

</div>

<script>

async function checkStatus(){

    const receiptId =

    document
    .getElementById("receiptId")
    .value
    .trim();

    if(!receiptId){

        alert(
            "Please Enter Receipt ID"
        );

        return;

    }

    try{

        const response =

        await fetch(

            `https://jhrc.onrender.com/status/${receiptId}`

        );

        const result =

        await response.json();

        if(!response.ok){

            document
            .getElementById("result")
            .innerHTML =

            '<div class="status-invalid">❌ Invalid Receipt ID</div>';

            return;

        }

        if(result.status === "Pending"){

            document
            .getElementById("result")
            .innerHTML =

            '<div class="status-pending">⏳ Admission Status: Pending Verification</div>';

        }

        else if(result.status === "Approved"){

            document
            .getElementById("result")
            .innerHTML =

            `
            <div class="status-approved">

                ✅ Admission Status: Approved

            </div>

            <a
            href="https://jhrc.onrender.com/download/${result.receiptId}"
            target="_blank"
            class="download-btn"
            >

                📄 Download PDF

            </a>
            `;

        }

    }

    catch(error){

        console.log(error);

        document
        .getElementById("result")
        .innerHTML =

        '<div class="status-invalid">❌ Server Error</div>';

    }

}

</script>

</body>

</html>
