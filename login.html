<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <style>

        body {

            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #002b5b, #00509d);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

        }

        .login-box {

            background: white;
            padding: 40px;
            border-radius: 10px;
            width: 350px;
            box-shadow: 0px 0px 20px rgba(0,0,0,0.2);

        }

        h1 {

            text-align: center;
            color: #002b5b;
            margin-bottom: 30px;

        }

        .field {

            margin-bottom: 20px;

        }

        label {

            display: block;
            margin-bottom: 8px;
            font-weight: bold;

        }

        input {

            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;

        }

        button {

            width: 100%;
            padding: 14px;
            background: #002b5b;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;

        }

        button:hover {

            background: #001f40;

        }

        .error {

            color: red;
            text-align: center;
            margin-top: 15px;

        }

    </style>

</head>

<body>

    <div class="login-box">

        <h1>Admin Login</h1>

        <div class="field">

            <label>Username</label>

            <input type="text" id="username">

        </div>

        <div class="field">

            <label>Password</label>

            <input type="password" id="password">

        </div>

        <button onclick="login()">

            Login

        </button>

        <div class="error" id="errorMessage">

        </div>

    </div>

    <script>

        if(localStorage.getItem("adminLoggedIn") === "true"){

            window.location.replace("admin.html");

        }

        function login(){

            const username =
            document.getElementById("username").value;

            const password =
            document.getElementById("password").value;

            if(

                username === "admin"

                &&

                password === "12345"

            ){

                localStorage.setItem("adminLoggedIn", "true");

                window.location.replace("admin.html");

            }

            else{

                document.getElementById("errorMessage")
                .innerText =
                "Invalid Username or Password";

            }

        }

    </script>

</body>

</html>
