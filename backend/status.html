<!DOCTYPE html>
<html>

<head>
    <title>Check Admission Status</title>
</head>

<body>

    <h2>Check Admission Status</h2>

    <input
        type="text"
        id="receiptId"
        placeholder="Enter Receipt ID"
    >

    <button onclick="checkStatus()">

        Check Status

    </button>

    <div id="result"></div>
<script>

async function checkStatus(){

    const receiptId =
    document
    .getElementById("receiptId")
    .value
    .trim();

    if(!receiptId){

        alert(
            "Please Enter Receipt ID"
        );

        return;

    }

    try{

        const response =
        await fetch(

            `https://jhrc.onrender.com/status/${receiptId}`

        );

        const result =
        await response.json();

        if(!response.ok){

            document
            .getElementById("result")
            .innerHTML =

            "<h3>Invalid Receipt ID</h3>";

            return;

        }

        if(result.status === "Pending"){

            document
            .getElementById("result")
            .innerHTML =

            "<h3>Admission Status: Pending Verification</h3>";

        }

        else if(
            result.status === "Approved"
        ){

            document
            .getElementById("result")
            .innerHTML =

            `
            <h3>
            Admission Status: Approved
            </h3>

            <a
            href="${result.pdfUrl}"
            target="_blank"
            >

            Download PDF

            </a>
            `;

        }

    }

    catch(error){

        console.log(error);

        document
        .getElementById("result")
        .innerHTML =

        "<h3>Server Error</h3>";

    }

}

</script>
</body>

</html>
