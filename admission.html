<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Library Admission Form</title>

    <style>

        body {

            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 20px;

        }

        .container {

            max-width: 900px;
            background: white;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);

        }

        .logo {

            text-align: center;
            margin-bottom: 20px;

        }

        .logo img {

            width: 120px;

        }

        h1 {

            text-align: center;
            color: #002b5b;

        }

        h2 {

            color: #002b5b;
            border-left: 5px solid goldenrod;
            padding-left: 10px;
            margin-top: 30px;

        }

        .row {

            display: flex;
            gap: 20px;
            margin-bottom: 20px;

        }

        .field {

            flex: 1;
            display: flex;
            flex-direction: column;

        }

        label {

            margin-bottom: 8px;
            font-weight: bold;

        }

        input,
        select,
        textarea {

            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;

        }

        textarea {

            resize: vertical;

        }

        .membership {

            margin-bottom: 20px;

        }

        .membership label {

            font-weight: normal;
            margin-left: 8px;

        }

        .checkbox {

            margin-top: 20px;
            display: flex;
            align-items: center;
            gap: 10px;

        }

        button {

            width: 100%;
            background: #002b5b;
            color: white;
            border: none;
            padding: 15px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 30px;

        }

        button:hover {

            background: #001f40;

        }

        button:disabled {

            background: gray;
            cursor: not-allowed;

        }

        .ocr-status {

            color: green;
            font-weight: bold;
            margin-top: 10px;

        }

        @media(max-width: 768px) {

            .row {

                flex-direction: column;

            }

        }

    </style>

</head>

<body>

    <div class="container">

        <div class="logo">

           <img
    src="backend/assets/logo.png"
    alt="JHRC Logo"
>
        </div>

        <h1>JHRC Library Admission Form</h1>

        <form id="admissionForm">

            <h2>Personal Details</h2>

            <div class="row">

                <div class="field">

                    <label>Full Name *</label>

                    <input 
                    type="text"
                    name="fullName"
                    id="fullName"
                    required
                    >

                </div>

                <div class="field">

                    <label>Phone Number *</label>

                    <input type="text" name="phoneNumber" required>

                </div>

            </div>

            <div class="row">

                <div class="field">

                    <label>Email *</label>

                    <input type="email" name="email" required>

                </div>

                <div class="field">

                    <label>Date of Birth *</label>

                    <input 
                    type="text"
                    name="dob"
                    id="dob"
                    required
                    >

                </div>

            </div>

            <div class="row">

                <div class="field">

                    <label>Gender *</label>

                    <select 
                    name="gender"
                    id="gender"
                    required
                    >

                        <option value="">Select</option>

                        <option>Male</option>

                        <option>Female</option>

                        <option>Other</option>

                    </select>

                </div>

                <div class="field">

                    <label>Address *</label>

                    <textarea name="address" required></textarea>

                </div>

            </div>

            <h2>Membership Details</h2>

            <div class="membership">

                <label>Membership Type *</label>

                <br><br>

                <input type="radio" name="membershipType" value="Student" required>

                <label>Student</label>

                <br><br>

                <input type="radio" name="membershipType" value="Faculty">

                <label>Faculty</label>

                <br><br>

                <input type="radio" name="membershipType" value="Research Scholar">

                <label>Research Scholar</label>

            </div>

            <div class="row">

                <div class="field">

                    <label>Membership Start Date *</label>

                    <input type="date" name="membershipStartDate" required>

                </div>

                <div class="field">

                    <label>Course / Department *</label>

                    <input type="text" name="course" required>

                </div>

            </div>

          <h2>Document Upload</h2>

<div class="row">

    <div class="field">

        <label>Aadhaar Front *</label>

        <input 
        type="file"
        name="aadhaarFront"
        accept="image/*"
        required
        >

    </div>

    <div class="field">

        <label>Aadhaar Back *</label>

        <input 
        type="file"
        name="aadhaarBack"
        accept="image/*"
        required
        >

    </div>

</div>

            </div>

            
            <h2>Emergency Contact</h2>

            <div class="row">

                <div class="field">

                    <label>Guardian Name *</label>

                    <input type="text" name="guardianName" required>

                </div>

                <div class="field">

                    <label>Emergency Contact Number *</label>

                    <input type="text" name="emergencyContact" required>

                </div>

            </div>

            <div class="checkbox">

                <input type="checkbox" required>

                <label>

                    I agree to abide by the library rules and regulations.

                </label>

            </div>

            <button type="submit" id="submitButton">

                Submit Application

            </button>

        </form>

    </div>

  

    <script>

        
        const form =
        document.getElementById("admissionForm");

        const submitButton =
        document.getElementById("submitButton");

        form.addEventListener("submit", async function(event) {

            event.preventDefault();

            submitButton.disabled = true;

            submitButton.innerText = "Saving Admission...";

            try {

                const formData =
                new FormData(form);

                const response = await fetch(

                    "https://jhrc.onrender.com/admission",

                    {

                        method: "POST",

                        body: formData

                    }

                );

                const result = await response.json();

                alert(result.message);

                if(result.pdfUrl){

                    window.open(result.pdfUrl, "_blank");

                }

                form.reset();

            }

            catch (error) {

                alert("Error Saving Admission");

            }

            finally {

                submitButton.disabled = false;

                submitButton.innerText = "Submit Application";

            }

        });

    </script>

</body>

</html>
