<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Library Admin Dashboard</title>

    <style>

        body {

            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 20px;

        }

        .container {

            max-width: 1500px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);

        }

        h1 {

            text-align: center;
            color: #002b5b;
            margin-bottom: 20px;

        }

        .top-bar {

            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;

        }

        .top-bar input {

            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;

        }

        .logout-btn {

            background: red;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;

        }

        .stats {

            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;

        }

        .card {

            flex: 1;
            min-width: 200px;
            background: #002b5b;
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;

        }

        .card h2 {

            margin: 0;
            font-size: 35px;

        }

        .card p {

            margin-top: 10px;

        }

        table {

            width: 100%;
            border-collapse: collapse;

        }

        th {

            background: #002b5b;
            color: white;
            padding: 12px;
            text-align: left;

        }

        td {

            padding: 12px;
            border-bottom: 1px solid #ddd;

        }

        tr:hover {

            background: #f1f1f1;

        }

        .delete-btn {

            background: red;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;

        }

        .delete-btn:hover {

            background: darkred;

        }

        .loading {

            text-align: center;
            font-size: 20px;
            margin-top: 30px;

        }

        a {

            color: #002b5b;
            font-weight: bold;
            text-decoration: none;

        }

        @media(max-width:768px){

            table {

                font-size: 12px;

            }

        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Library Admin Dashboard</h1>

        <div class="top-bar">

            <input
            type="text"
            id="searchInput"
            placeholder="Search by name, phone or course..."
            onkeyup="searchStudents()"
            >

            <button class="logout-btn" onclick="logout()">

                Logout

            </button>

        </div>

        <div class="stats">

            <div class="card">

                <h2 id="totalStudents">0</h2>

                <p>Total Students</p>

            </div>

            <div class="card">

                <h2 id="studentMembers">0</h2>

                <p>Student Memberships</p>

            </div>

            <div class="card">

                <h2 id="facultyMembers">0</h2>

                <p>Faculty Memberships</p>

            </div>

        </div>

        <div class="loading" id="loading">

            Loading Students...

        </div>

        <table id="studentTable" style="display:none;">

            <thead>

                <tr>

                    <th>Name</th>

                    <th>Phone</th>

                    <th>Email</th>

                    <th>Course</th>

                    <th>Membership</th>

                    <th>Aadhaar Front</th>

                    <th>Aadhaar Back</th>

                    <th>Status</th>

                    <th>PDF</th>

                    <th>Action</th>

                </tr>

            </thead>

            <tbody id="tableBody">

            </tbody>

        </table>

    </div>

    <script>

        const isLoggedIn =
        localStorage.getItem("adminLoggedIn");

        if(isLoggedIn !== "true"){

            window.location.replace("login.html");

        }

        let allStudents = [];

        async function loadStudents() {

            try {

                const response = await fetch(
                    "https://jhrc.onrender.com/students"
                );

                const students = await response.json();

                allStudents = students;

                updateStats(students);

                displayStudents(students);

            }

            catch(error){

                alert("Error Loading Students");

            }

        }

        function updateStats(students){

            document.getElementById("totalStudents")
            .innerText = students.length;

            const studentCount =
            students.filter(student =>
                student.membershipType === "Student"
            ).length;

            const facultyCount =
            students.filter(student =>
                student.membershipType === "Faculty"
            ).length;

            document.getElementById("studentMembers")
            .innerText = studentCount;

            document.getElementById("facultyMembers")
            .innerText = facultyCount;

        }

        function displayStudents(students){

            const tableBody =
            document.getElementById("tableBody");

            const loading =
            document.getElementById("loading");

            const studentTable =
            document.getElementById("studentTable");

            tableBody.innerHTML = "";

            loading.style.display = "none";

            studentTable.style.display = "table";

            students.forEach(student => {

               const aadhaarFrontUrl =
student.aadhaarFront || "#";

const aadhaarBackUrl =
student.aadhaarBack || "#";

                const row = `

                    <tr>

                        <td>${student.fullName || ""}</td>

                        <td>${student.phoneNumber || ""}</td>

                        <td>${student.email || ""}</td>

                        <td>${student.course || ""}</td>

                        <td>${student.membershipType || ""}</td>
                        

                        <td>

                            <a 
                            href="${aadhaarFrontUrl}"
                            target="_blank"
                            >

                                View Front

                            </a>

                        </td>

                        <td>

                            <a 
                            href="${aadhaarBackUrl}"
                            target="_blank"
                            >

                                View Back

                            </a>

                        </td>
                            <td>${student.status || "Pending"}</td>
                           <td>

    ${
       student.status === "Approved"

?

`<a
href="https://jhrc.onrender.com/download/${student.receiptId}"
target="_blank"
>

Download PDF

</a>`

:

"Not Available!"
    }

</td>
                       <td>

   ${student.status !== "Approved"
? `
<button
onclick="approveStudent('${student._id}')"
>

    Approve

</button>
`
: ""
}

    ${student.seatNumber 
    ? `<button onclick="openSeatModal(${JSON.stringify(student).replace(/"/g, '&quot;')})" style="background: #4CAF50; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; margin-right: 5px;">Edit Seat (${student.seatNumber})</button>`
    : `<button onclick="openSeatModal(${JSON.stringify(student).replace(/"/g, '&quot;')})" style="background: #2196F3; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; margin-right: 5px;">Assign Seat</button>`
    }

    <button
    class="delete-btn"
    onclick="deleteStudent('${student._id}')"
    >

        Delete

    </button>

</td>

                    </tr>

                `;

                tableBody.innerHTML += row;

            });

        }

        function openSeatModal(student) {
            console.log('Opening seat assignment for student:', student.fullName, 'Current seat:', student.seatNumber || 'None');
            // Navigate to admin-seat.html with student ID
            window.location.href = `admin-seat.html?student=${student._id}`;
        }

async function approveStudent(id){

    try{

        const response = await fetch(

            `https://jhrc.onrender.com/student/approve/${id}`,

            {

                method: "PUT"

            }

        );

        const result = await response.text();

        alert(result);

        location.reload();

    }

    catch(error){

        console.log(error);

        alert("Error Approving Student");

    }

}
        function searchStudents(){

            const searchValue =
            document.getElementById("searchInput")
            .value
            .toLowerCase();

            const filteredStudents =
            allStudents.filter(student =>

                (student.fullName || "")
                .toLowerCase()
                .includes(searchValue)

                ||

                (student.phoneNumber || "")
                .toLowerCase()
                .includes(searchValue)

                ||

                (student.course || "")
                .toLowerCase()
                .includes(searchValue)

            );

            displayStudents(filteredStudents);

        }

        async function deleteStudent(id){

            const confirmDelete =
            confirm("Are you sure you want delete this student?");

            if(!confirmDelete){

                return;

            }

            try {

                const response = await fetch(

                    `https://jhrc.onrender.com/student/${id}`,

                    {

                        method:"DELETE"

                    }

                );

                const result = await response.text();

                alert(result);

                loadStudents();

            }

            catch(error){

                alert("Error Deleting Student");

            }

        }

        function logout(){

            localStorage.removeItem("adminLoggedIn");

            window.location.replace("login.html");

        }

        loadStudents();

    </script>

</body>

</html>
